name: Deploy

on:
    push:
        branches: [development]
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: deploy
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run build
            # GitHub Pages serves the master branch
            - uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_branch: master
                  publish_dir: ./build
